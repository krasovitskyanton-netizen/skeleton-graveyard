          # ================= JAVA: shield skeleton =================
          cat > src/main/java/com/skeletonmod/ShieldSkeleton.java <<'EOF'
          package com.skeletonmod;

          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.tags.DamageTypeTags;
          import net.minecraft.tags.ItemTags;
          import net.minecraft.util.RandomSource;
          import net.minecraft.world.DifficultyInstance;
          import net.minecraft.world.damagesource.DamageSource;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.EquipmentSlot;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.ai.attributes.AttributeSupplier;
          import net.minecraft.world.entity.ai.attributes.Attributes;
          import net.minecraft.world.entity.monster.skeleton.AbstractSkeleton;
          import net.minecraft.world.entity.monster.skeleton.Skeleton;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.Items;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.phys.Vec3;

          public class ShieldSkeleton extends Skeleton {
              private int shieldCooldown = 0;

              public ShieldSkeleton(EntityType<? extends Skeleton> type, Level level) {
                  super(type, level);
                  this.xpReward = 10;
              }

              public static AttributeSupplier.Builder createShieldAttributes() {
                  return AbstractSkeleton.createAttributes()
                          .add(Attributes.MAX_HEALTH, 30.0)
                          .add(Attributes.MOVEMENT_SPEED, 0.22)
                          .add(Attributes.ATTACK_DAMAGE, 3.0)
                          .add(Attributes.ARMOR, 6.0)
                          .add(Attributes.KNOCKBACK_RESISTANCE, 0.5);
              }

              @Override
              protected void populateDefaultEquipmentSlots(RandomSource random, DifficultyInstance difficulty) {
                  this.setItemSlot(EquipmentSlot.MAINHAND, new ItemStack(Items.IRON_SWORD));
                  this.setItemSlot(EquipmentSlot.OFFHAND, new ItemStack(Items.SHIELD));
                  this.setItemSlot(EquipmentSlot.HEAD, new ItemStack(Items.IRON_HELMET));
              }

              @Override
              public void aiStep() {
                  super.aiStep();
                  if (this.shieldCooldown > 0) this.shieldCooldown--;
              }

              @Override
              public boolean hurtServer(ServerLevel level, DamageSource source, float amount) {
                  if (this.shieldCooldown == 0 && this.getOffhandItem().is(Items.SHIELD)
                          && !source.is(DamageTypeTags.BYPASSES_SHIELD)) {
                      // Удар топором выбивает щит на 5 секунд
                      if (source.getEntity() instanceof LivingEntity attacker
                              && source.getDirectEntity() == attacker
                              && attacker.getMainHandItem().is(ItemTags.AXES)) {
                          this.shieldCooldown = 100;
                          this.playSound(SoundEvents.ZOMBIE_BREAK_WOODEN_DOOR, 0.8F, 1.2F);
                      } else if (isInFront(source)) {
                          this.playSound(SoundEvents.ZOMBIE_ATTACK_IRON_DOOR, 0.6F, 1.5F);
                          return false; // заблокировано (стрелы отскакивают)
                      }
                  }
                  return super.hurtServer(level, source, amount);
              }

              private boolean isInFront(DamageSource source) {
                  Vec3 from = source.getSourcePosition();
                  if (from == null) return false;
                  Vec3 toSource = new Vec3(from.x - this.getX(), 0.0, from.z - this.getZ());
                  Vec3 look = this.getViewVector(1.0F);
                  Vec3 flatLook = new Vec3(look.x, 0.0, look.z);
                  if (toSource.lengthSqr() < 1.0E-4 || flatLook.lengthSqr() < 1.0E-4) return false;
                  return toSource.normalize().dot(flatLook.normalize()) > 0.4;
              }
          }
          EOF

          # ================= JAVA: items & armor =================
          cat > src/main/java/com/skeletonmod/ModItems.java <<'EOF'
          package com.skeletonmod;

          import java.util.Map;
          import java.util.function.Function;
          import net.fabricmc.fabric.api.itemgroup.v1.ItemGroupEvents;
          import net.minecraft.core.Registry;
          import net.minecraft.core.registries.BuiltInRegistries;
          import net.minecraft.core.registries.Registries;
          import net.minecraft.resources.ResourceKey;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.tags.TagKey;
          import net.minecraft.world.item.CreativeModeTabs;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.equipment.ArmorMaterial;
          import net.minecraft.world.item.equipment.ArmorType;
          import net.minecraft.world.item.equipment.EquipmentAsset;
          import net.minecraft.world.item.equipment.EquipmentAssets;

          public final class ModItems {
              public static final TagKey<Item> REPAIRS_BONE_ARMOR =
                      TagKey.create(Registries.ITEM, SkeletonMod.id("repairs_bone_armor"));
              public static final ResourceKey<EquipmentAsset> BONE_ASSET =
                      ResourceKey.create(EquipmentAssets.ROOT_ID, SkeletonMod.id("bone"));

              // Между железом и алмазом
              public static final ArmorMaterial BONE_MATERIAL = new ArmorMaterial(
                      22,
                      Map.of(ArmorType.BOOTS, 2, ArmorType.LEGGINGS, 5, ArmorType.CHESTPLATE, 7,
                              ArmorType.HELMET, 3, ArmorType.BODY, 8),
                      15,
                      SoundEvents.ARMOR_EQUIP_CHAIN,
                      1.0F,
                      0.0F,
                      REPAIRS_BONE_ARMOR,
                      BONE_ASSET);

              public static final Item CURSED_BONE = register("cursed_bone", Item::new);
              public static final Item BONE_HELMET = register("bone_helmet",
                      p -> new Item(p.humanoidArmor(BONE_MATERIAL, ArmorType.HELMET)));
              public static final Item BONE_CHESTPLATE = register("bone_chestplate",
                      p -> new Item(p.humanoidArmor(BONE_MATERIAL, ArmorType.CHESTPLATE)));
              public static final Item BONE_LEGGINGS = register("bone_leggings",
                      p -> new Item(p.humanoidArmor(BONE_MATERIAL, ArmorType.LEGGINGS)));
              public static final Item BONE_BOOTS = register("bone_boots",
                      p -> new Item(p.humanoidArmor(BONE_MATERIAL, ArmorType.BOOTS)));

              private static Item register(String name, Function<Item.Properties, Item> factory) {
                  ResourceKey<Item> key = ResourceKey.create(Registries.ITEM, SkeletonMod.id(name));
                  Item item = factory.apply(new Item.Properties().setId(key));
                  return Registry.register(BuiltInRegistries.ITEM, key, item);
              }

              public static void init() {
                  ItemGroupEvents.modifyEntriesEvent(CreativeModeTabs.INGREDIENTS)
                          .register(entries -> entries.accept(CURSED_BONE));
                  ItemGroupEvents.modifyEntriesEvent(CreativeModeTabs.COMBAT).register(entries -> {
                      entries.accept(BONE_HELMET);
                      entries.accept(BONE_CHESTPLATE);
                      entries.accept(BONE_LEGGINGS);
                      entries.accept(BONE_BOOTS);
                  });
              }

              private ModItems() {}
          }
          EOF

          # ================= JAVA: full set bonus =================
          cat > src/main/java/com/skeletonmod/BoneArmorBonus.java <<'EOF'
          package com.skeletonmod;

          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.world.effect.MobEffects;
          import net.minecraft.world.entity.EquipmentSlot;
          import net.minecraft.world.entity.monster.skeleton.AbstractSkeleton;

          public final class BoneArmorBonus {
              public static void tick(ServerLevel level) {
                  for (ServerPlayer player : level.players()) {
                      if (!hasFullSet(player)) continue;

                      // Иммунитет к Иссушению
                      if (player.hasEffect(MobEffects.WITHER)) player.removeEffect(MobEffects.WITHER);

                      // Обычные скелеты не нападают первыми
                      for (AbstractSkeleton s : level.getEntitiesOfClass(AbstractSkeleton.class,
                              player.getBoundingBox().inflate(24.0),
                              e -> e.getTarget() == player
                                      && e.getLastHurtByMob() != player
                                      && !(e instanceof NecromancerSkeleton)
                                      && !(e instanceof BerserkerSkeleton)
                                      && !(e instanceof ShieldSkeleton))) {
                          s.setTarget(null);
                      }
                  }
              }

              private static boolean hasFullSet(ServerPlayer p) {
                  return p.getItemBySlot(EquipmentSlot.HEAD).is(ModItems.BONE_HELMET)
                          && p.getItemBySlot(EquipmentSlot.CHEST).is(ModItems.BONE_CHESTPLATE)
                          && p.getItemBySlot(EquipmentSlot.LEGS).is(ModItems.BONE_LEGGINGS)
                          && p.getItemBySlot(EquipmentSlot.FEET).is(ModItems.BONE_BOOTS);
              }

              private BoneArmorBonus() {}
          }
          EOF

          # ================= JAVA: graveyard dungeon =================
          cat > src/main/java/com/skeletonmod/GraveyardFeature.java <<'EOF'
          package com.skeletonmod;

          import com.mojang.serialization.Codec;
          import java.util.ArrayList;
          import java.util.List;
          import net.minecraft.core.BlockPos;
          import net.minecraft.core.Direction;
          import net.minecraft.core.registries.Registries;
          import net.minecraft.resources.ResourceKey;
          import net.minecraft.tags.BlockTags;
          import net.minecraft.util.RandomSource;
          import net.minecraft.world.RandomizableContainer;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.level.WorldGenLevel;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.ChestBlock;
          import net.minecraft.world.level.block.LadderBlock;
          import net.minecraft.world.level.block.LanternBlock;
          import net.minecraft.world.level.block.entity.SpawnerBlockEntity;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.level.levelgen.Heightmap;
          import net.minecraft.world.level.levelgen.feature.Feature;
          import net.minecraft.world.level.levelgen.feature.FeaturePlaceContext;
          import net.minecraft.world.level.levelgen.feature.configurations.NoneFeatureConfiguration;
          import net.minecraft.world.level.storage.loot.LootTable;

          public class GraveyardFeature extends Feature<NoneFeatureConfiguration> {
              public static final ResourceKey<LootTable> CHEST_LOOT =
                      ResourceKey.create(Registries.LOOT_TABLE, SkeletonMod.id("chests/graveyard"));
              private static final int R = 7;

              public GraveyardFeature(Codec<NoneFeatureConfiguration> codec) {
                  super(codec);
              }

              @Override
              public boolean place(FeaturePlaceContext<NoneFeatureConfiguration> ctx) {
                  WorldGenLevel level = ctx.level();
                  RandomSource random = ctx.random();
                  BlockPos origin = ctx.origin();

                  // Только на ровной суше
                  if (!level.getBlockState(origin.below()).is(BlockTags.DIRT)) return false;
                  if (!level.getFluidState(origin).isEmpty()) return false;
                  for (int dx = -R; dx <= R; dx += R) {
                      for (int dz = -R; dz <= R; dz += R) {
                          int h = level.getHeight(Heightmap.Types.WORLD_SURFACE_WG, origin.getX() + dx, origin.getZ() + dz);
                          if (Math.abs(h - origin.getY()) > 2) return false;
                      }
                  }

                  // 1. Земля и расчистка
                  for (int x = -R; x <= R; x++) {
                      for (int z = -R; z <= R; z++) {
                          for (int y = 0; y <= 6; y++) set(level, origin.offset(x, y, z), Blocks.AIR.defaultBlockState());
                          set(level, origin.offset(x, -1, z), ground(random));
                          for (int y = -2; y >= -4; y--) {
                              BlockPos p = origin.offset(x, y, z);
                              if (level.getBlockState(p).canBeReplaced()) set(level, p, Blocks.DIRT.defaultBlockState());
                          }
                      }
                  }
                  for (int z = -R; z <= -3; z++) set(level, origin.offset(0, -1, z), Blocks.DIRT_PATH.defaultBlockState());

                  // 2. Ограда с фонарями душ
                  List<BlockPos> fences = new ArrayList<>();
                  for (int x = -R; x <= R; x++) {
                      for (int z = -R; z <= R; z++) {
                          if (Math.abs(x) != R && Math.abs(z) != R) continue;
                          if (z == -R && x == 0) continue; // вход
                          BlockPos p = origin.offset(x, 0, z);
                          set(level, p, Blocks.DARK_OAK_FENCE.defaultBlockState());
                          fences.add(p);
                          if ((Math.abs(x) == R && Math.abs(z) == R) || (z == -R && Math.abs(x) == 1)) {
                              set(level, p.above(), Blocks.SOUL_LANTERN.defaultBlockState());
                          }
                      }
                  }
                  for (BlockPos p : fences) {
                      set(level, p, Block.updateFromNeighbourShapes(level.getBlockState(p), level, p));
                  }

                  // 3. Надгробия
                  for (int x = -5; x <= 5; x += 2) {
                      for (int z = -5; z <= 5; z += 2) {
                          if (Math.abs(x) <= 3 && Math.abs(z) <= 3) continue;
                          if (random.nextFloat() < 0.2F) continue;
                          BlockPos stone = origin.offset(x, 0, z);
                          set(level, stone, gravestone(random));
                          if (random.nextFloat() < 0.25F) set(level, stone.above(), Blocks.SKELETON_SKULL.defaultBlockState());
                          set(level, stone.offset(0, -1, 1), random.nextBoolean()
                                  ? Blocks.PODZOL.defaultBlockState() : Blocks.COARSE_DIRT.defaultBlockState());
                      }
                  }

                  // 4. Склеп
                  for (int x = -2; x <= 2; x++) {
                      for (int z = -2; z <= 2; z++) {
                          set(level, origin.offset(x, -1, z), Blocks.POLISHED_ANDESITE.defaultBlockState());
                          boolean wall = Math.abs(x) == 2 || Math.abs(z) == 2;
                          for (int y = 0; y <= 3; y++) {
                              if (y == 3 || wall) set(level, origin.offset(x, y, z), bricks(random));
                          }
                          if (Math.abs(x) <= 1 && Math.abs(z) <= 1) {
                              set(level, origin.offset(x, 4, z), Blocks.STONE_BRICK_SLAB.defaultBlockState());
                          }
                      }
                  }
                  set(level, origin.offset(0, 0, -2), Blocks.AIR.defaultBlockState());
                  set(level, origin.offset(0, 1, -2), Blocks.AIR.defaultBlockState());
                  set(level, origin.offset(0, 2, 0), Blocks.SOUL_LANTERN.defaultBlockState().setValue(LanternBlock.HANGING, true));

                  // 5. Подземные катакомбы
                  for (int x = -4; x <= 4; x++) {
                      for (int z = -4; z <= 4; z++) {
                          for (int y = -8; y <= -4; y++) {
                              boolean shell = Math.abs(x) == 4 || Math.abs(z) == 4 || y == -8 || y == -4;
                              set(level, origin.offset(x, y, z), shell ? bricks(random) : Blocks.AIR.defaultBlockState());
                          }
                      }
                  }

                  // 6. Лестница вниз
                  BlockState ladder = Blocks.LADDER.defaultBlockState().setValue(LadderBlock.FACING, Direction.NORTH);
                  for (int y = -1; y >= -7; y--) {
                      set(level, origin.offset(0, y, 2), Blocks.STONE_BRICKS.defaultBlockState());
                      set(level, origin.offset(0, y, 1), ladder);
                  }

                  // 7. Спавнеры, сундуки, паутина
                  spawner(level, origin.offset(0, -7, -3), ModEntities.NECROMANCER, random);
                  spawner(level, origin.offset(-3, -7, -1), ModEntities.BERSERKER, random);
                  spawner(level, origin.offset(3, -7, -1), ModEntities.SHIELD, random);
                  chest(level, origin.offset(-3, -7, 3), random);
                  chest(level, origin.offset(3, -7, 3), random);
                  for (int i = 0; i < 8; i++) {
                      BlockPos p = origin.offset(random.nextInt(7) - 3, -5, random.nextInt(7) - 3);
                      if (level.getBlockState(p).isAir()) set(level, p, Blocks.COBWEB.defaultBlockState());
                  }
                  for (int i = 0; i < 4; i++) {
                      BlockPos p = origin.offset(random.nextInt(7) - 3, -7, random.nextInt(7) - 3);
                      if (level.getBlockState(p).isAir()) set(level, p, Blocks.SKELETON_SKULL.defaultBlockState());
                  }
                  return true;
              }

              private static void set(WorldGenLevel level, BlockPos pos, BlockState state) {
                  level.setBlock(pos, state, 2);
              }

              private static BlockState ground(RandomSource r) {
                  float f = r.nextFloat();
                  if (f < 0.5F) return Blocks.GRASS_BLOCK.defaultBlockState();
                  if (f < 0.8F) return Blocks.COARSE_DIRT.defaultBlockState();
                  return Blocks.PODZOL.defaultBlockState();
              }

              private static BlockState bricks(RandomSource r) {
                  float f = r.nextFloat();
                  if (f < 0.40F) return Blocks.STONE_BRICKS.defaultBlockState();
                  if (f < 0.70F) return Blocks.MOSSY_STONE_BRICKS.defaultBlockState();
                  if (f < 0.95F) return Blocks.CRACKED_STONE_BRICKS.defaultBlockState();
                  return Blocks.BONE_BLOCK.defaultBlockState();
              }

              private static BlockState gravestone(RandomSource r) {
                  switch (r.nextInt(5)) {
                      case 0: return Blocks.STONE_BRICK_WALL.defaultBlockState();
                      case 1: return Blocks.MOSSY_STONE_BRICK_WALL.defaultBlockState();
                      case 2: return Blocks.COBBLESTONE_WALL.defaultBlockState();
                      case 3: return Blocks.CHISELED_STONE_BRICKS.defaultBlockState();
                      default: return Blocks.MOSSY_COBBLESTONE.defaultBlockState();
                  }
              }

              private static void spawner(WorldGenLevel level, BlockPos pos, EntityType<?> type, RandomSource random) {
                  set(level, pos, Blocks.SPAWNER.defaultBlockState());
                  if (level.getBlockEntity(pos) instanceof SpawnerBlockEntity spawner) {
                      spawner.setEntityId(type, random);
                  }
              }

              private static void chest(WorldGenLevel level, BlockPos pos, RandomSource random) {
                  set(level, pos, Blocks.CHEST.defaultBlockState().setValue(ChestBlock.FACING, Direction.NORTH));
                  RandomizableContainer.setBlockEntityLootTable(level, random, pos, CHEST_LOOT);
              }
          }
          EOF

