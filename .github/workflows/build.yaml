# skeleton-graveyard
name: Build Skeleton Graveyard mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create project files
        run: |
          mkdir -p src/main/java/com/skeletonmod
          mkdir -p src/main/resources/assets/skeletonmod/lang
          mkdir -p src/main/resources/assets/skeletonmod/items
          mkdir -p src/main/resources/assets/skeletonmod/equipment
          mkdir -p src/main/resources/data/skeletonmod/loot_table/entities
          mkdir -p src/main/resources/data/skeletonmod/loot_table/chests
          mkdir -p src/main/resources/data/skeletonmod/recipe
          mkdir -p src/main/resources/data/skeletonmod/tags/item
          mkdir -p src/main/resources/data/skeletonmod/worldgen/configured_feature
          mkdir -p src/main/resources/data/skeletonmod/worldgen/placed_feature

          # ================= GRADLE =================
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=26.3
          loader_version=0.19.5
          loom_version=1.16-SNAPSHOT
          fabric_api_version=0.161.0+26.3
          mod_version=1.0.0
          maven_group=com.skeletonmod
          archives_base_name=skeleton-graveyard
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'skeleton-graveyard'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'net.fabricmc.fabric-loom' version "${loom_version}"
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              implementation "net.fabricmc:fabric-loader:${project.loader_version}"
              implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_25
              targetCompatibility = JavaVersion.VERSION_25
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.encoding = "UTF-8"
              it.options.release = 25
          }
          EOF

          # ================= fabric.mod.json =================
          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "skeletonmod",
            "version": "${version}",
            "name": "Skeleton Graveyard",
            "description": "Скелет-некромант, скелет-берсерк, скелет со щитом, костяная броня и данж «Кладбище скелетов».",
            "authors": ["You"],
            "license": "MIT",
            "environment": "*",
            "entrypoints": {
              "main": ["com.skeletonmod.SkeletonMod"],
              "client": ["com.skeletonmod.SkeletonModClient"]
            },
            "depends": {
              "fabricloader": ">=0.19.5",
              "minecraft": "~26.3",
              "java": ">=25",
              "fabric-api": "*"
            }
          }
          EOF

          # ================= JAVA: main class =================
          cat > src/main/java/com/skeletonmod/SkeletonMod.java <<'EOF'
          package com.skeletonmod;

          import net.fabricmc.api.ModInitializer;
          import net.fabricmc.fabric.api.biome.v1.BiomeModifications;
          import net.fabricmc.fabric.api.biome.v1.BiomeSelectors;
          import net.fabricmc.fabric.api.entity.event.v1.ServerLivingEntityEvents;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;
          import net.minecraft.core.Registry;
          import net.minecraft.core.registries.BuiltInRegistries;
          import net.minecraft.core.registries.Registries;
          import net.minecraft.resources.Identifier;
          import net.minecraft.resources.ResourceKey;
          import net.minecraft.world.effect.MobEffectInstance;
          import net.minecraft.world.effect.MobEffects;
          import net.minecraft.world.level.biome.Biomes;
          import net.minecraft.world.level.levelgen.GenerationStep;
          import net.minecraft.world.level.levelgen.feature.Feature;
          import net.minecraft.world.level.levelgen.feature.configurations.NoneFeatureConfiguration;

          public class SkeletonMod implements ModInitializer {
              public static final String MOD_ID = "skeletonmod";

              public static Identifier id(String path) {
                  return Identifier.fromNamespaceAndPath(MOD_ID, path);
              }

              public static final Feature<NoneFeatureConfiguration> GRAVEYARD =
                      new GraveyardFeature(NoneFeatureConfiguration.CODEC);

              @Override
              public void onInitialize() {
                  ModItems.init();
                  ModEntities.init();

                  // Данж "Кладбище скелетов"
                  Registry.register(BuiltInRegistries.FEATURE, id("graveyard"), GRAVEYARD);
                  BiomeModifications.addFeature(
                          BiomeSelectors.includeByKey(Biomes.PLAINS, Biomes.SUNFLOWER_PLAINS, Biomes.FOREST,
                                  Biomes.DARK_FOREST, Biomes.TAIGA, Biomes.SAVANNA),
                          GenerationStep.Decoration.SURFACE_STRUCTURES,
                          ResourceKey.create(Registries.PLACED_FEATURE, id("graveyard")));

                  // Атаки некроманта накладывают Иссушение
                  ServerLivingEntityEvents.AFTER_DAMAGE.register((entity, source, baseDamage, damageTaken, blocked) -> {
                      if (!blocked && damageTaken > 0 && source.getEntity() instanceof NecromancerSkeleton) {
                          entity.addEffect(new MobEffectInstance(MobEffects.WITHER, 100, 0));
                      }
                  });

                  // Бонус полного комплекта костяной брони
                  ServerTickEvents.END_WORLD_TICK.register(BoneArmorBonus::tick);
              }
          }
          EOF

          # ================= JAVA: client =================
          cat > src/main/java/com/skeletonmod/SkeletonModClient.java <<'EOF'
          package com.skeletonmod;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.rendering.v1.EntityRendererRegistry;
          import net.minecraft.client.renderer.entity.SkeletonRenderer;

          public class SkeletonModClient implements ClientModInitializer {
              @Override
              public void onInitializeClient() {
                  EntityRendererRegistry.register(ModEntities.NECROMANCER, SkeletonRenderer::new);
                  EntityRendererRegistry.register(ModEntities.BERSERKER, SkeletonRenderer::new);
                  EntityRendererRegistry.register(ModEntities.SHIELD, SkeletonRenderer::new);
              }
          }
          EOF

          # ================= JAVA: entities registry =================
          cat > src/main/java/com/skeletonmod/ModEntities.java <<'EOF'
          package com.skeletonmod;

          import net.fabricmc.fabric.api.object.builder.v1.entity.FabricDefaultAttributeRegistry;
          import net.minecraft.core.Registry;
          import net.minecraft.core.registries.BuiltInRegistries;
          import net.minecraft.core.registries.Registries;
          import net.minecraft.resources.ResourceKey;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.MobCategory;

          public final class ModEntities {
              public static final EntityType<NecromancerSkeleton> NECROMANCER =
                      register("necromancer_skeleton", NecromancerSkeleton::new);
              public static final EntityType<BerserkerSkeleton> BERSERKER =
                      register("berserker_skeleton", BerserkerSkeleton::new);
              public static final EntityType<ShieldSkeleton> SHIELD =
                      register("shield_skeleton", ShieldSkeleton::new);

              private static <T extends Entity> EntityType<T> register(String name, EntityType.EntityFactory<T> factory) {
                  ResourceKey<EntityType<?>> key = ResourceKey.create(Registries.ENTITY_TYPE, SkeletonMod.id(name));
                  EntityType<T> type = EntityType.Builder.of(factory, MobCategory.MONSTER)
                          .sized(0.6F, 1.99F)
                          .eyeHeight(1.74F)
                          .clientTrackingRange(8)
                          .build(key);
                  return Registry.register(BuiltInRegistries.ENTITY_TYPE, key, type);
              }

              public static void init() {
                  FabricDefaultAttributeRegistry.register(NECROMANCER, NecromancerSkeleton.createNecromancerAttributes());
                  FabricDefaultAttributeRegistry.register(BERSERKER, BerserkerSkeleton.createBerserkerAttributes());
                  FabricDefaultAttributeRegistry.register(SHIELD, ShieldSkeleton.createShieldAttributes());
              }

              private ModEntities() {}
          }
          EOF

          # ================= JAVA: necromancer =================
          cat > src/main/java/com/skeletonmod/NecromancerSkeleton.java <<'EOF'
          package com.skeletonmod;

          import net.minecraft.core.BlockPos;
          import net.minecraft.core.particles.ParticleTypes;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.tags.EntityTypeTags;
          import net.minecraft.util.RandomSource;
          import net.minecraft.world.DifficultyInstance;
          import net.minecraft.world.entity.EntitySpawnReason;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.EquipmentSlot;
          import net.minecraft.world.entity.ai.attributes.AttributeSupplier;
          import net.minecraft.world.entity.ai.attributes.Attributes;
          import net.minecraft.world.entity.monster.Monster;
          import net.minecraft.world.entity.monster.skeleton.AbstractSkeleton;
          import net.minecraft.world.entity.monster.skeleton.Skeleton;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.Items;
          import net.minecraft.world.level.Level;

          public class NecromancerSkeleton extends Skeleton {
              private int summonCooldown = 100;

              public NecromancerSkeleton(EntityType<? extends Skeleton> type, Level level) {
                  super(type, level);
                  this.xpReward = 15;
              }

              public static AttributeSupplier.Builder createNecromancerAttributes() {
                  return AbstractSkeleton.createAttributes()
                          .add(Attributes.MAX_HEALTH, 40.0)
                          .add(Attributes.MOVEMENT_SPEED, 0.23)
                          .add(Attributes.FOLLOW_RANGE, 32.0);
              }

              @Override
              protected void populateDefaultEquipmentSlots(RandomSource random, DifficultyInstance difficulty) {
                  super.populateDefaultEquipmentSlots(random, difficulty); // лук
                  this.setItemSlot(EquipmentSlot.HEAD, new ItemStack(Items.WITHER_SKELETON_SKULL));
                  this.setDropChance(EquipmentSlot.HEAD, 0.0F);
              }

              @Override
              public void aiStep() {
                  super.aiStep();
                  if (!(this.level() instanceof ServerLevel server) || !this.isAlive()) return;

                  // Лечение союзной нежити
                  if (this.tickCount % 40 == 0) {
                      for (Monster ally : server.getEntitiesOfClass(Monster.class, this.getBoundingBox().inflate(8.0),
                              e -> e != this && e.getType().is(EntityTypeTags.UNDEAD) && e.getHealth() < e.getMaxHealth())) {
                          ally.heal(2.0F);
                          server.sendParticles(ParticleTypes.SOUL, ally.getX(), ally.getY() + 1.0, ally.getZ(),
                                  4, 0.3, 0.4, 0.3, 0.01);
                      }
                  }

                  // Призыв скелетов
                  if (this.getTarget() != null && --this.summonCooldown <= 0) {
                      this.summonCooldown = 300 + this.random.nextInt(200);
                      int minions = server.getEntitiesOfClass(Skeleton.class, this.getBoundingBox().inflate(16.0),
                              e -> e.getType() == EntityType.SKELETON).size();
                      if (minions < 4) {
                          this.playSound(SoundEvents.EVOKER_PREPARE_SUMMON, 1.0F, 0.7F);
                          summonMinion(server);
                          summonMinion(server);
                      }
                  }
              }

              private void summonMinion(ServerLevel server) {
                  Skeleton minion = EntityType.SKELETON.create(server, EntitySpawnReason.MOB_SUMMONED);
                  if (minion == null) return;
                  double x = this.getX() + (this.random.nextDouble() - 0.5) * 4.0;
                  double z = this.getZ() + (this.random.nextDouble() - 0.5) * 4.0;
                  BlockPos pos = BlockPos.containing(x, this.getY(), z);
                  minion.snapTo(x, this.getY(), z, this.getYRot(), 0.0F);
                  minion.finalizeSpawn(server, server.getCurrentDifficultyAt(pos), EntitySpawnReason.MOB_SUMMONED, null);
                  minion.setTarget(this.getTarget());
                  server.addFreshEntity(minion);
                  server.sendParticles(ParticleTypes.SOUL_FIRE_FLAME, x, this.getY() + 1.0, z, 15, 0.3, 0.6, 0.3, 0.02);
              }
          }
          EOF

          # ================= JAVA: berserker =================
          cat > src/main/java/com/skeletonmod/BerserkerSkeleton.java <<'EOF'
